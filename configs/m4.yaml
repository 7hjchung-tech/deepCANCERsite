# M4: LoRA fine-tuned ESM encoder, Block B NOT used, end-to-end diff_emb.
# Differs from M3 in use_block_b ONLY, and from M2 in esm_mode/use_lora ONLY.
# Optimisation settings live in base.yaml on purpose — see the note there.
extends: base.yaml
model_id: M4

esm_mode: e2e
use_lora: true
use_block_b: false

esm:
  device: "cuda"         # ESM-2 is in the training loop here (M1/M2 never load it)

lora:
  enabled: true          # rank/alpha/target_layers inherited from base.yaml

# Memory only: the same effective batch as M1/M2 (32), split because a 650M
# backward pass does not fit at 32. Do NOT change one of these without the other.
batch_size: 8
gradient_accumulation: 4
